<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Roboto", "Helvetica Neue", Arial, sans-serif; }
    a { color: #00693E; } a:hover { color: #005432; }
    .d { font-family: "Barlow Semi Condensed", "Roboto Condensed", Arial Narrow, sans-serif; }
    .lbl { font-size: 12px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: #5E6F66; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; overflow: hidden; background: #FAFAF7; color: #111A15; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: #00693E">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg>
    <span style="font-size: 16px; font-weight: 500; color: #FFFFFF; flex-grow: 1">Ernest is coming to you</span>
    <span class="d" style="font-size: 22px; font-weight: 700; color: #FFFFFF">2 min</span>
  </div>

  <div style="height: 208px; overflow: hidden; border-bottom: 1px solid #E2E6DF">
    <svg width="390" height="208" viewBox="0 0 390 208" style="display: block">
      <rect width="390" height="208" fill="#EDEFE8"></rect>
      <g stroke="#FFFFFF" stroke-width="11" fill="none" stroke-linecap="round">
        <path d="M-10 158 L130 142 L280 118 L400 96"></path>
        <path d="M90 208 L136 128 L186 42"></path>
        <path d="M280 208 L310 140"></path>
      </g>
      <g fill="#C9D1C8"><rect x="30" y="24" width="46" height="22" rx="3"></rect><rect x="300" y="160" width="56" height="26" rx="3"></rect></g>
      <path d="M146 114 L114 154" stroke="#00693E" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8 6"></path>
      <circle cx="114" cy="154" r="12" fill="#111A15"></circle><circle cx="114" cy="154" r="4" fill="#FFFFFF"></circle>
      <g transform="translate(146 114)">
        <circle r="16" fill="#00693E"></circle>
        <path d="M-6 3h2l1.5-4h5l2 4h1.5" stroke="#FFFFFF" stroke-width="1.9" fill="none" stroke-linecap="round"></path>
        <circle cx="-4.5" cy="4" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.7"></circle>
        <circle cx="5" cy="4" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.7"></circle>
      </g>
    </svg>
  </div>

  <div style="flex-grow: 1; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 14px">

    <!-- the PIN is the headline: it is what the rider must act on -->
    <div style="background: #F3F9F5; border: 2px solid #00693E; border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
        <span class="lbl" style="color: #14372A">Tell him this number</span>
        <span style="font-size: 13px; color: #3F4E46">Do not climb on the bike before he says it back</span>
      </div>
      <span class="d" style="font-size: 46px; font-weight: 700; color: #00693E; letter-spacing: .04em; line-height: 1">4072</span>
    </div>

    <div style="display: flex; gap: 13px; align-items: center">
      <div style="width: 60px; height: 60px; border-radius: 50%; background: #EDEFE8; flex-shrink: 0; display: grid; place-items: center; border: 2px solid #00693E">
        <span class="d" style="font-size: 24px; font-weight: 700; color: #00693E">EN</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
        <span class="d" style="font-size: 22px; font-weight: 700; line-height: 1.1">Ernest Njie</span>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 14px; font-weight: 500">4.8 &#9733;</span>
          <span style="color: #C9D1C8">|</span>
          <span style="font-size: 14px; color: #3F4E46">1,240 rides</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00693E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-3 7.4-7 9-4-1.6-7-4.8-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
          <span style="font-size: 13px; font-weight: 500; color: #00693E">ID checked &middot; helmet on board</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span class="lbl">Plate</span>
        <span class="d" style="font-size: 19px; font-weight: 700; border: 2px solid #111A15; border-radius: 5px; padding: 4px 8px">SW 4192 B</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; min-height: 56px; border: 1px solid #C9D1C8; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 9px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#111A15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a1.5 1.5 0 0 1-1.7 1.5C10.3 19.2 4.8 13.7 4 6.2A1.5 1.5 0 0 1 5.5 4.5z"></path></svg>
        <span style="font-size: 15px; font-weight: 500">Call him</span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; border: 1px solid #C9D1C8; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 9px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#111A15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="17.5" cy="5.5" r="3"></circle><circle cx="6.5" cy="12" r="3"></circle><circle cx="17.5" cy="18.5" r="3"></circle><path d="M9.2 10.6l5.6-3.4M9.2 13.4l5.6 3.4"></path></svg>
        <span style="font-size: 15px; font-weight: 500">Share trip</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #F5F7F3; border-radius: 8px; padding: 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00693E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-3 7.4-7 9-4-1.6-7-4.8-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
      <span style="font-size: 14px; color: #3F4E46; flex-grow: 1">Mum is watching this trip until you arrive</span>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #E2E6DF; padding-top: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span class="lbl">To pay in cash</span>
        <span class="d" style="font-size: 30px; font-weight: 700; line-height: 1">250 <span style="font-size: 14px; font-weight: 500; color: #5E6F66">FCFA</span></span>
      </div>
      <div style="min-height: 56px; background: #C0102E; border-radius: 8px; display: flex; align-items: center; gap: 9px; padding: 0 22px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"></path><path d="M12 9v4M12 16v.01"></path></svg>
        <span class="d" style="font-size: 21px; font-weight: 700; color: #FFFFFF">GET HELP</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
