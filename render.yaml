# Fako Ride on Render — the same host StudyHub already runs on.
#
#   Render dashboard → New → Blueprint → pick this repository.
#
# Render creates both services below and asks for every value marked
# `sync: false`. The database is not here: it is Neon, like StudyHub's, because
# the API needs PostGIS (Neon has it) and Render's own Postgres free tier
# expires. DEPLOY.md walks through the whole thing in order.
#
# Frankfurt for everything: of Render's regions it is the nearest to Buea, and
# Neon has a region there too, so the API and its database share a city.

services:
  - type: web
    name: fako-ride-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    region: frankfurt
    # Not `free`. A free service sleeps after 15 idle minutes, and asleep it
    # runs none of its clocks: offers stop expiring and moving to the next
    # driver, payments stop being chased, and every driver's live connection
    # drops. A ride app that sleeps is a ride app that is down.
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render puts one proxy in front. Trusting it is what lets the rate limits
      # see the real caller; without it every request seems to come from Render,
      # and the first flood would lock out the whole country.
      - key: TRUST_PROXY
        value: "1"

      # Neon's *direct* connection string, not the "-pooler" one: Prisma's
      # migrations take a lock the pooler cannot hold. Keep ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fako-ride-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

      - key: SMS_PROVIDER
        value: orange
      - key: ORANGE_SMS_CLIENT_ID
        sync: false
      - key: ORANGE_SMS_CLIENT_SECRET
        sync: false

      - key: MOMO_PROVIDER
        value: fapshi
      - key: FAPSHI_API_USER
        sync: false
      - key: FAPSHI_API_KEY
        sync: false
      # Sandbox until `npm run fapshi:check` has passed and Fapshi has switched
      # on Direct Pay and payouts for the live account. Then, deliberately, false.
      - key: FAPSHI_SANDBOX
        value: "true"
      # Generated here, then pasted into the Fapshi dashboard as the webhook secret.
      - key: FAPSHI_WEBHOOK_SECRET
        generateValue: true

      - key: DOCUMENT_STORE
        value: postgres

      # Only if "enhanced push security" is switched on in the Expo project.
      - key: EXPO_ACCESS_TOKEN
        sync: false

  # The ops console: approving drivers, answering complaints, taking alarms.
  # A static site, free on Render. It calls a relative /api, which the rewrite
  # below sends to the API, so the browser only ever talks to one origin — no
  # CORS to configure, and the admin token never has to be allowed cross-site.
  - type: web
    name: fako-ride-ops
    runtime: static
    rootDir: apps/ops
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fako-ride-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Nobody frames the screen that shows ID cards.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  # Codes, positions and live offers: short-lived by design, so nothing here
  # needs to survive a restart. Reachable only from the API, never the internet.
  - type: keyvalue
    name: fako-ride-redis
    region: frankfurt
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
